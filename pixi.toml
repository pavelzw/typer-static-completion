[workspace]
name = "typer-static-completions"
channels = ["conda-forge"]
exclude-newer = "7d"
platforms = ["osx-arm64", "osx-64", "linux-64", "win-64"]
preview = ["pixi-build"]

[package]
name = "typer-static-completions"
[package.build.backend]
name = "pixi-build-python"
version = "*"
[package.host-dependencies]
python = ">=3.10"
hatchling = "*"
uv = "*"

[dependencies]
typer-static-completions = { path = "." }
typer = ">=0.26,<0.27"

[feature.test.dependencies]
pytest = "*"
pytest-cov = "*"
mypy = "*"
[feature.test.tasks]
test = "pytest"
test-coverage = "pytest --cov=typer_static_completions --cov-report=xml --cov-report=term-missing"

[feature.build.dependencies]
python = "*"
hatchling = "*"
python-build = "*"
twine = ">=6"
[feature.build.tasks]
build-wheel = "python -m build --no-isolation ."
check-wheel = "twine check dist/*"

[feature.snapshots]
platforms = ["osx-arm64", "osx-64", "linux-64"]
[feature.snapshots.dependencies]
bash = ">=5.2,<6"
pexpect = ">=4.9,<5"
pyte = ">=0.8,<0.9"
[feature.snapshots.tasks]
test-snapshots = "pytest --require-snapshots tests/test_snapshots.py tests/test_snapshot_harness.py"
update-snapshots = { cmd = "pytest --require-snapshots tests/test_snapshots.py", env = { UPDATE_SNAPSHOTS = "1" } }

[feature.lint.dependencies]
lefthook = "*"
ruff = "*"
prettier = "*"
taplo = "*"
pre-commit-hooks = "*"
typos = "*"
zizmor = "*"
[feature.lint.tasks]
pre-commit-install = "lefthook install"
lint = "lefthook run pre-commit --all-files"

[feature.py310.dependencies]
python = "3.10.*"
[feature.py311.dependencies]
python = "3.11.*"
[feature.py312.dependencies]
python = "3.12.*"
[feature.py313.dependencies]
python = "3.13.*"
[feature.py314.dependencies]
python = "3.14.*"

[environments]
default = ["test", "build", "lint"]
snapshots = ["test", "snapshots"]
py310 = ["py310", "test"]
py311 = ["py311", "test"]
py312 = ["py312", "test"]
py313 = ["py313", "test"]
py314 = ["py314", "test"]
