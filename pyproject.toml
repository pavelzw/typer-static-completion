[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "typer-static-completions"
description = "Generate static shell completions for typer applications"
authors = [{ name = "Pavel Zwerschke", email = "pavelzw@gmail.com" }]
# replaced in CI
version = "0.0.0"
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.10"
readme = "README.md"
dependencies = ["typer >=0.26,<0.27", "tomli >=2,<3; python_version < '3.11'"]

[project.urls]
repository = "https://github.com/pavelzw/typer-static-completions"

[tool.setuptools.packages.find]
include = ["typer_static_completions"]

[project.scripts]
typer-static-completions = "typer_static_completions.cli:main"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
ignore = [
  "N803", # https://docs.astral.sh/ruff/rules/invalid-argument-name
  "N806", # https://docs.astral.sh/ruff/rules/non-lowercase-variable-in-function
  "E501", # https://docs.astral.sh/ruff/faq/#is-the-ruff-linter-compatible-with-black
]
select = [
  # pyflakes
  "F",
  # pycodestyle
  "E",
  "W",
  # isort
  "I",
  # pep8-naming
  "N",
  # pyupgrade
  "UP",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = '3.10'
no_implicit_optional = true
check_untyped_defs = true

# If you run into `missing library stubs or py.typed marker` errors
# and no stubs are available for this library, you can add an override
# to ignore the missing imports.
# [[tool.mypy.overrides]]
# module = ["my_module"]
# ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
